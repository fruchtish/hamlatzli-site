<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>המלצות ספרים - המלצלי</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #8e44ad 0%, #2c3e50 100%);
            color: white;
            text-align: center;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        h1 {
            font-size: 3em;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .subtitle {
            font-size: 1.5em;
            margin-bottom: 40px;
            opacity: 0.9;
        }
        .book-categories {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin: 40px 0;
        }
        .category {
            background: rgba(255, 255, 255, 0.15);
            padding: 20px;
            border-radius: 15px;
            min-width: 200px;
            backdrop-filter: blur(10px);
        }
        .category h3 {
            color: #ecf0f1;
            margin-bottom: 10px;
        }
        .stats {
            display: flex;
            justify-content: space-around;
            margin: 50px 0;
            flex-wrap: wrap;
        }
        .stat {
            text-align: center;
        }
        .stat-number {
            font-size: 2.5em;
            font-weight: bold;
            color: #f1c40f;
        }
        .cta {
            background: linear-gradient(45deg, #27ae60, #2ecc71);
            color: white;
            padding: 15px 40px;
            border: none;
            border-radius: 25px;
            font-size: 1.2em;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            margin-top: 30px;
            transition: transform 0.3s ease;
        }
        .cta:hover {
            transform: translateY(-3px);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📚 המלצות ספרים</h1>
        <p class="subtitle">גלה ספרים חדשים ומעניינים לפי המלצות קוראים</p>
        
        <div class="book-categories">
            <div class="category">
                <h3>📖 ספרות</h3>
                <p>רומנים וסיפורים מרגשים</p>
            </div>
            <div class="category">
                <h3>🔬 מדע</h3>
                <p>ספרי פופולריזציה של המדע</p>
            </div>
            <div class="category">
                <h3>📈 עסקים</h3>
                <p>ספרי ניהול ויזמות</p>
            </div>
            <div class="category">
                <h3>🧘 פיתוח אישי</h3>
                <p>ספרים להתפתחות ושיפור</p>
            </div>
        </div>
        
        <div class="stats">
            <div class="stat">
                <div class="stat-number">2,500+</div>
                <div>ספרים מומלצים</div>
            </div>
            <div class="stat">
                <div class="stat-number">15,000+</div>
                <div>ביקורות</div>
            </div>
            <div class="stat">
                <div class="stat-number">500+</div>
                <div>מבקרים פעילים</div>
            </div>
        </div>
        
        <a href="/index.html" class="cta">התחל לגלות ספרים מומלצים</a>
    </div>
</body>
</html>
