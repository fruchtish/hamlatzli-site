<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>המלצלי - פלטפורמת המלצות</title>
  <link rel="stylesheet" href="/css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <div class="container header-container">
      <div class="logo">המלצלי</div>
      <nav>
        <ul class="nav-menu">
          <li><a href="/">ראשי</a></li>
          <li><a href="/categories.html">קטגוריות</a></li>
          <li class="logged-out"><a href="/login.html">התחברות</a></li>
          <li class="logged-out"><a href="/register.html">הרשמה</a></li>
          <li class="logged-in" style="display: none;"><a href="/add-recommendation.html">הוסף המלצה</a></li>
          <li class="logged-in admin-only" style="display: none;"><a href="/admin">ניהול</a></li>
          <li class="logged-in" style="display: none;"><a href="#" id="logout-btn">התנתקות</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <div class="container">
      <div id="alert-container"></div>
      
      <section class="hero">
        <h1>ברוכים הבאים להמלצלי</h1>
        <p>המקום לשתף ולקבל המלצות על כל דבר - מסעדות, סרטים, ספרים, מוצרים ועוד...</p>
        <div class="cta-buttons">
          <a href="/add-recommendation.html" class="btn btn-primary logged-in" style="display: none;">שתף המלצה</a>
          <a href="/register.html" class="btn btn-primary logged-out">הצטרף עכשיו</a>
          <a href="/categories.html" class="btn btn-outline">עיין בקטגוריות</a>
        </div>
      </section>
      
      <section class="recommendations-section">
        <div class="section-header">
          <h2>המלצות אחרונות</h2>
          <div class="section-actions">
            <select id="category-filter" class="form-control">
              <option value="">כל הקטגוריות</option>
              <option value="מסעדות">מסעדות</option>
              <option value="סרטים">סרטים</option>
              <option value="ספרים">ספרים</option>
              <option value="מוצרים">מוצרים</option>
              <option value="אטרקציות">אטרקציות</option>
            </select>
            <select id="sort-options" class="form-control">
              <option value="recent">הכי חדש</option>
              <option value="rating">דירוג גבוה</option>
              <option value="likes">הכי אהוב</option>
            </select>
          </div>
        </div>
        
        <div class="recommendations-container">
          <div id="recommendations" class="recommendations">
            <!-- Recommendations will be loaded here by JavaScript -->
            <div class="loading-state">
              <div class="loading-spinner"></div>
              <p>טוען המלצות...</p>
            </div>
          </div>
        </div>
      </section>
    </div>
  </main>

  <footer>
    <div class="container">
      <p>כל הזכויות שמורות &copy; המלצלי 2025</p>
    </div>
  </footer>

  <script src="/js/main.js"></script>
  <script src="/js/recommendations.js"></script>
</body>
</html>
