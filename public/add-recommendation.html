<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>הוסף המלצה - המלצ-לי</title>
  <link rel="stylesheet" href="/css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <div class="container header-container">
      <div class="logo">המלצ-לי</div>
      <nav>
        <ul class="nav-menu">
          <li><a href="/">ראשי</a></li>
          <li><a href="/categories.html">קטגוריות</a></li>
          <li class="logged-in" style="display: none;"><span id="user-info"></span></li>
          <li class="logged-in" style="display: none;"><a href="#" id="logout-btn">התנתקות</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <div class="container">
      <div class="auth-container">
        <div class="card">
          <h2>שתף את ההמלצה שלך</h2>
          <div id="alert-container"></div>
          
          <form id="add-recommendation-form">
            <div class="form-group">
              <label for="recommendation-title">כותרת</label>
              <input type="text" id="recommendation-title" class="form-control" required>
            </div>
            <div class="form-group">
              <label for="recommendation-category">קטגוריה</label>
              <select id="recommendation-category" class="form-control" required>
                <option value="">בחרו קטגוריה</option>
                <option value="מסעדות">מסעדות ובתי קפה</option>
                <option value="סרטים">סרטים וסדרות</option>
                <option value="ספרים">ספרים וקריאה</option>
                <option value="מוצרים">מוצרים ושופינג</option>
                <option value="אטרקציות">אטרקציות ובילויים</option>
              </select>
            </div>
            <div class="form-group">
              <label for="recommendation-rating">דירוג</label>
              <select id="recommendation-rating" class="form-control" required>
                <option value="5">5 כוכבים - מעולה</option>
                <option value="4">4 כוכבים - טוב מאוד</option>
                <option value="3">3 כוכבים - טוב</option>
                <option value="2">2 כוכבים - סביר</option>
                <option value="1">1 כוכב - לא מומלץ</option>
              </select>
            </div>
            <div class="form-group">
              <label for="recommendation-description">תיאור</label>
              <textarea id="recommendation-description" class="form-control" rows="5" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary">הוסף המלצה</button>
          </form>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <div class="container">
      <p>כל הזכויות שמורות &copy; המלצ-לי 2024</p>
    </div>
  </footer>

  <script src="/js/main.js"></script>
</body>
</html>
