<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>הוסף המלצה - המלצ-לי</title>
  <link rel="stylesheet" href="/css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <div class="container header-container">
      <div class="logo">המלצ-לי</div>
      <nav>
        <ul class="nav-menu">
          <li><a href="/">ראשי</a></li>
          <li><a href="/categories.html">קטגוריות</a></li>
          <li class="logged-in" style="display: none;"><span id="user-info"></span></li>
          <li class="logged-in" style="display: none;"><a href="#" id="logout-btn">התנתקות</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <div class="container">
      <div class="auth-container">
        <div class="card">
          <h2>שתף את ההמלצה שלך</h2>
          <div id="alert-container"></div>
          
          <form id="add-recommendation-form">
            <div class="form-group">
              <label for="recommendation-title">כותרת</label>
              <input type="text" id="recommendation-title" class="form-control" required>
            </div>
            <div class="form-group">
              <label for="recommendation-category">קטגוריה</label>
              <select id="recommendation-category" class="form-control" required>
                <option value="">בחרו קטגוריה</option>
                <option value="מסעדות">מסעדות ובתי קפה</option>
                <option value="סרטים">סרטים וסדרות</option>
                <option value="ספרים">ספרים וקריאה</option>
                <option value="מוצרים">מוצרים ושופינג</option>
                <option value="אטרקציות">אטרקציות ובילויים</option>
              </select>
            </div>
            <div class="form-group">
              <label for="recommendation-rating">דירוג</label>
              <select id="recommendation-rating" class="form-control" required>
                <option value="5">5 כוכבים - מעולה</option>
                <option value="4">4 כוכבים - טוב מאוד</option>
                <option value="3">3 כוכבים - טוב</option>
                <option value="2">2 כוכבים - סביר</option>
                <option value="1">1 כוכב - לא מומלץ</option>
              </select>
            </div>
            <div class="form-group location-group" style="display: none;">
              <label for="recommendation-location">מיקום/כתובת</label>
              <input type="text" id="recommendation-location" class="form-control" placeholder="הזן כתובת מדויקת">
            </div>
            
            <div class="form-group">
              <label for="recommendation-price">טווח מחירים</label>
              <select id="recommendation-price" class="form-control">
                <option value="">בחר טווח מחירים</option>
                <option value="₪">₪ - עד 50 ש״ח</option>
                <option value="₪₪">₪₪ - 50-100 ש״ח</option>
                <option value="₪₪₪">₪₪₪ - 100-200 ש״ח</option>
                <option value="₪₪₪₪">₪₪₪₪ - 200+ ש״ח</option>
              </select>
            </div>

            <div class="form-group">
              <label for="recommendation-description">תיאור</label>
              <textarea id="recommendation-description" class="form-control" rows="5" required placeholder="ספר על החוויה שלך..."></textarea>
            </div>

            <div class="form-group">
              <label for="recommendation-image">תמונה</label>
              <div class="image-upload-container">
                <input type="file" id="recommendation-image" class="form-control" accept="image/*">
                <div class="image-preview" id="image-preview"></div>
              </div>
            </div>

            <div class="form-actions">
              <button type="submit" class="btn btn-primary">הוסף המלצה</button>
              <button type="reset" class="btn btn-outline">נקה טופס</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <div class="container">
      <p>כל הזכויות שמורות &copy; המלצ-לי 2024</p>
    </div>
  </footer>

  <script src="/js/main.js"></script>
  <script src="/js/add-recommendation.js"></script>
  
  <template id="drag-drop-template">
    <div class="drag-drop-text">
      גרור ושחרר תמונה כאן<br>
      <span>או</span><br>
      לחץ לבחירת קובץ
    </div>
  </template>

  <script>
    // Add drag and drop functionality
    const dropZone = document.querySelector('.image-upload-container');
    const template = document.getElementById('drag-drop-template');
    
    dropZone.innerHTML = template.innerHTML;

    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
      dropZone.addEventListener(eventName, preventDefaults, false);
    });

    function preventDefaults(e) {
      e.preventDefault();
      e.stopPropagation();
    }

    ['dragenter', 'dragover'].forEach(eventName => {
      dropZone.addEventListener(eventName, highlight, false);
    });

    ['dragleave', 'drop'].forEach(eventName => {
      dropZone.addEventListener(eventName, unhighlight, false);
    });

    function highlight(e) {
      dropZone.classList.add('drag-highlight');
    }

    function unhighlight(e) {
      dropZone.classList.remove('drag-highlight');
    }

    dropZone.addEventListener('drop', handleDrop, false);

    function handleDrop(e) {
      const dt = e.dataTransfer;
      const files = dt.files;
      const fileInput = document.getElementById('recommendation-image');
      
      fileInput.files = files;
      // Trigger change event to update preview
      fileInput.dispatchEvent(new Event('change'));
    }
  </script>
</body>
</html>
