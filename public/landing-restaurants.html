<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>המלצות מסעדות - המלצלי</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-align: center;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        h1 {
            font-size: 3em;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .subtitle {
            font-size: 1.5em;
            margin-bottom: 40px;
            opacity: 0.9;
        }
        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin: 50px 0;
        }
        .feature {
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .feature h3 {
            color: #ffd700;
            margin-bottom: 15px;
        }
        .cta {
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            color: white;
            padding: 15px 40px;
            border: none;
            border-radius: 25px;
            font-size: 1.2em;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            margin-top: 30px;
            transition: transform 0.3s ease;
        }
        .cta:hover {
            transform: translateY(-3px);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🍽️ המלצות מסעדות</h1>
        <p class="subtitle">גלה את המסעדות הטובות ביותר בעיר שלך</p>
        
        <div class="features">
            <div class="feature">
                <h3>🌟 המלצות אמיתות</h3>
                <p>קרא המלצות מאמתות ממבקרים אמיתיים שבדקו את המסעדות בעצמם</p>
            </div>
            <div class="feature">
                <h3>📍 מיקום נוח</h3>
                <p>מצא מסעדות באזור שלך או בכל מקום שאתה מתכנן לבקר</p>
            </div>
            <div class="feature">
                <h3>💎 טיפים בלעדיים</h3>
                <p>גלה את המנות הכי מומלצות ושעות הביקור הטובות ביותר</p>
            </div>
        </div>
        
        <a href="/index.html" class="cta">התחל לגלות מסעדות מעולות</a>
    </div>
</body>
</html>
