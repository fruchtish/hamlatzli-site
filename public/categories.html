<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>קטגוריות - המלצלי</title>
  <link rel="stylesheet" href="/css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <div class="container header-container">
      <div class="logo">המלצלי</div>
      <nav>
        <ul class="nav-menu">
          <li><a href="/">ראשי</a></li>
          <li><a href="/categories.html">קטגוריות</a></li>
          <li class="logged-out"><a href="/login.html">התחברות</a></li>
          <li class="logged-out"><a href="/register.html">הרשמה</a></li>
          <li class="logged-in" style="display: none;"><a href="/add-recommendation.html">הוסף המלצה</a></li>
          <li class="logged-in admin-only" style="display: none;"><a href="/admin">ניהול</a></li>
          <li class="logged-in" style="display: none;"><a href="#" id="logout-btn">התנתקות</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <div class="container">
      <div id="alert-container"></div>
      
      <section class="categories-section">
        <h1>קטגוריות</h1>
        <div class="categories-grid">
          <div class="category-card">
            <img src="/images/restaurant-icon.svg" alt="מסעדות">
            <h3>מסעדות</h3>
            <p>המלצות על מסעדות, בתי קפה ומקומות אוכל</p>
          </div>
          <div class="category-card">
            <img src="/images/movie-icon.svg" alt="סרטים">
            <h3>סרטים</h3>
            <p>המלצות על סרטים, סדרות וקולנוע</p>
          </div>
          <div class="category-card">
            <img src="/images/book-icon.svg" alt="ספרים">
            <h3>ספרים</h3>
            <p>המלצות על ספרים וספרות</p>
          </div>
          <div class="category-card">
            <img src="/images/product-icon.svg" alt="מוצרים">
            <h3>מוצרים</h3>
            <p>המלצות על מוצרים ומותגים</p>
          </div>
        </div>
      </section>
    </div>
  </main>

  <footer>
    <div class="container">
      <p>כל הזכויות שמורות &copy; המלצלי 2025</p>
    </div>
  </footer>

  <script src="/js/main.js"></script>
</body>
</html>
