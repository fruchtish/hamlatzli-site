
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>התחברות - המלצלי</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/rubik@4.5.0/index.min.css">
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --background: #f8fafc;
      --card-background: #ffffff;
      --border: #e2e8f0;
      --text-primary: #1e293b;
      --text-secondary: #64748b;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }

    body {
      font-family: 'Rubik', sans-serif;
      background-color: var(--background);
      color: var(--text-primary);
      direction: rtl;
    }

    .card {
      background-color: var(--card-background);
      border-radius: 0.75rem;
      box-shadow: var(--shadow);
    }

    .button-primary {
      background-color: var(--primary);
      transition: background-color 0.2s;
    }
    
    .button-primary:hover {
      background-color: var(--primary-hover);
    }

    .button-outline {
      background-color: transparent;
      border: 1px solid var(--primary);
      color: var(--primary);
      transition: all 0.2s;
    }
    
    .button-outline:hover {
      background-color: var(--primary);
      color: white;
    }

    .input {
      border: 1px solid var(--border);
      border-radius: 0.375rem;
      padding: 0.625rem;
      transition: border 0.2s;
      width: 100%;
      background-color: white;
    }

    .input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.2);
    }

    .label {
      margin-bottom: 0.5rem;
      display: block;
      font-weight: 500;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    .auth-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
  </style>
</head>
<body class="bg-gray-100">
  <div class="auth-container">
    <div class="card max-w-md w-full p-8">
      <div class="text-center mb-8">
        <h1 class="text-3xl font-bold">המלצלי</h1>
        <p class="text-gray-500 mt-2">ברוכים השבים!</p>
      </div>

      <div id="alert-container" class="mb-6"></div>

      <form id="login-form">
        <div class="form-group">
          <label for="email" class="label">כתובת דואר אלקטרוני</label>
          <input type="email" id="email" class="input" placeholder="הזן את כתובת האימייל שלך" required>
        </div>

        <div class="form-group">
          <label for="password" class="label">סיסמה</label>
          <div class="relative">
            <input type="password" id="password" class="input" placeholder="הזן את הסיסמה שלך" required>
          </div>
          <div class="flex justify-end mt-1">
            <a href="#" class="text-sm text-primary hover:underline">שכחת את הסיסמה?</a>
          </div>
        </div>

        <div class="form-group">
          <label class="flex items-center">
            <input type="checkbox" class="ml-2 h-4 w-4 text-primary">
            <span class="text-sm">זכור אותי</span>
          </label>
        </div>

        <button type="submit" class="button-primary w-full rounded-md py-3 text-white font-medium">התחברות</button>
      </form>

      <div class="mt-6 border-t border-gray-200 pt-6 text-center text-sm">
        <p>אין לך חשבון עדיין?</p>
        <a href="/register.html" class="text-primary font-medium hover:underline block mt-2">הירשם עכשיו</a>
      </div>

      <div class="mt-8 text-center">
        <a href="/" class="button-outline inline-block px-4 py-2 rounded-md text-sm">חזרה לדף הבית</a>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const loginForm = document.getElementById('login-form');
      const alertContainer = document.getElementById('alert-container');

      loginForm.addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        // כאן יהיה הקוד לשליחת בקשת התחברות לשרת
        // לצורך הדוגמה נציג אזהרה זמנית
        
        showAlert('מתחבר למערכת...', 'info');

        // סימולציה של תהליך התחברות
        setTimeout(() => {
          if (email && password) {
            // להמחשה בלבד - כאן תתבצע קריאת API אמיתית
            showAlert('התחברת בהצלחה! מעביר לדף הבית...', 'success');
            
            // ניתוב לדף הבית לאחר התחברות מוצלחת
            setTimeout(() => {
              window.location.href = '/';
            }, 1500);
          } else {
            showAlert('אנא מלא את כל השדות הנדרשים', 'error');
          }
        }, 1000);
      });

      function showAlert(message, type) {
        alertContainer.innerHTML = '';
        
        const alert = document.createElement('div');
        alert.className = 'p-4 mb-4 rounded-md text-sm';
        
        switch(type) {
          case 'success':
            alert.className += ' bg-green-50 text-green-800';
            break;
          case 'error':
            alert.className += ' bg-red-50 text-red-800';
            break;
          case 'info':
            alert.className += ' bg-blue-50 text-blue-800';
            break;
          default:
            alert.className += ' bg-gray-50 text-gray-800';
        }
        
        alert.textContent = message;
        alertContainer.appendChild(alert);
      }
    });
  </script>
</body>
</html>
