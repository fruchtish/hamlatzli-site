<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>הרשמה - המלצ-לי</title>
  <link rel="stylesheet" href="/css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <div class="container header-container">
      <div class="logo">המלצ-לי</div>
      <nav>
        <ul class="nav-menu">
          <li><a href="/">ראשי</a></li>
          <li><a href="/categories.html">קטגוריות</a></li>
          <li><a href="/login.html">התחברות</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <div class="container">
      <div class="auth-container">
        <div class="card">
          <h2>ברוכים הבאים להמלצ-לי!</h2>
          <p class="auth-subtitle">הצטרפו לקהילת הממליצים שלנו</p>
          <div id="alert-container"></div>
          
          <form id="register-form">
            <div class="form-group">
              <label for="register-username">שם משתמש</label>
              <input type="text" id="register-username" class="form-control" placeholder="בחרו שם משתמש" required>
            </div>
            <div class="form-group">
              <label for="register-email">כתובת דואר אלקטרוני</label>
              <input type="email" id="register-email" class="form-control" placeholder="הזינו את כתובת המייל שלכם" required>
            </div>
            <div class="form-group">
              <label for="register-password">סיסמה</label>
              <input type="password" id="register-password" class="form-control" placeholder="בחרו סיסמה חזקה" required>
            </div>
            <div class="form-group">
              <label for="register-password-confirm">אימות סיסמה</label>
              <input type="password" id="register-password-confirm" class="form-control" placeholder="הזינו שוב את הסיסמה" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block">הצטרפות למערכת</button>
          </form>
          
          <p class="auth-footer">כבר יש לכם חשבון? <a href="/login.html">התחברו עכשיו</a></p>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <div class="container">
      <p>כל הזכויות שמורות &copy; המלצ-לי 2024</p>
    </div>
  </footer>

  <script src="/js/main.js"></script>
</body>
</html>
